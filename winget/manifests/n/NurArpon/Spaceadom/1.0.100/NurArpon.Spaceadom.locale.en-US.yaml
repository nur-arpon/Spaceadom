Description: >-
  Spaceadom turns your spacebar into a system-wide modifier key. Hold Space
  and tap a letter to launch the app bound to it; tap the same combination
  again to minimise it, and again to bring it back. Hold Space for a moment
  and a radial guide appears showing every shortcut you've set. Tapping Space
  on its own always types a space, exactly as it always has. No account, no
  analytics, and its local settings and log never leave your computer.
