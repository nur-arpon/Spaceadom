# Build Spaceadom on GitHub's machines and publish a Release with the
# installers attached.
#
# WHY THIS EXISTS: so releasing never involves your laptop again. Push a tag
# and GitHub builds BOTH installers, creates the release page, and uploads
# them.
# Nothing to remember, nothing to drag into a browser.
#
# TWO installers again from 1.0.54. The .msi was dropped in 1.0.41 because it
# installs per-machine while the setup.exe installs per-user, which put two
# copies on one machine both grabbing the spacebar (PROBLEM 129). That risk is
# now handled where it belongs: PROBLEM 141's dashboard banner detects a second
# install and removes it with one permission prompt. So the .msi is back, built
# from a custom WiX template (src-tauri/wix/main.wxs) whose ONLY change is
# util:CloseApplication - the fix for the silent-update failure it always had
# (PROBLEM 127). Stock tauri CLI; no forked bundler, no suppressed validation.
#
# HOW TO RELEASE:
#   1. bump the version in package.json, src-tauri/tauri.conf.json and
#      src-tauri/Cargo.toml (all three must match)
#   2. git commit -am "1.0.33"
#   3. git tag v1.0.33
#   4. git push && git push --tags
# The release appears at /releases within about ten minutes.
#
# You can also run it by hand from the Actions tab (workflow_dispatch) to test
# the pipeline without tagging anything.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# The job creates a release and uploads to it, so it needs write access to the
# repository contents. Nothing else.
permissions:
  contents: write

jobs:
  build:
    # Windows-only app, so a Windows runner. Free for public repositories.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      # A tag of v1.0.27 must build 1.0.27 source.
      #
      # Without this, the workflow cheerfully builds whatever sits on the
      # tagged commit and publishes it under the tag's name — so a release
      # can contain a different version than it claims, and nothing anywhere
      # says so. That is a silent failure, and this project has had enough of
      # those. Fail loudly and early instead, before the 10-minute build.
      - name: Check tag matches source version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag  = "${{ github.ref_name }}" -replace '^v',''
          $pkg  = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $conf = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          # Cargo.toml is checked too, and it is the one that matters most for
          # diagnosis: it stamps the exe's FileVersion, which is how an install
          # is proven to have actually landed (PROBLEM 127). A Cargo.toml left
          # behind produces a binary that REPORTS the old version while
          # containing the new code — the worst possible state to debug from.
          $cargo = ([regex]::Match((Get-Content src-tauri/Cargo.toml -Raw), '(?m)^version\s*=\s*"([^"]+)"')).Groups[1].Value
          Write-Host "tag=$tag  package.json=$pkg  tauri.conf.json=$conf  Cargo.toml=$cargo"
          if ($tag -ne $pkg -or $tag -ne $conf -or $tag -ne $cargo) {
            Write-Host "::error::Tag v$tag does not match the source version (package.json=$pkg, tauri.conf.json=$conf, Cargo.toml=$cargo). Either bump all three to $tag, or tag v$pkg instead. No installer was built or uploaded."
            exit 1
          }

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # Rust builds are slow from cold. This caches the compiled dependencies
      # so later releases take a few minutes instead of fifteen.
      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      # The frontend MUST be built before any cargo command: Tauri's
      # generate_context! reads the dist folder at compile time, and a missing
      # one fails with a bare "proc macro panicked" naming no cause.
      - name: Build frontend
        run: npm run build

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Spaceadom ${{ github.ref_name }}"
          # Written into the release page. Point people at the installer and
          # at the changelog rather than making them read commits.
          releaseBody: |
            Hold **Space** and tap a key to launch, focus or minimise any app.

            ### Install
            **Most people: download `Spaceadom_*_x64-setup.exe`** and run it.
            It installs for your user account only and never asks for an
            administrator password, including for updates.

            The `.msi` is the same app, for anyone who needs one (managed
            deployment). It installs for the whole PC and asks for admin once.
            **Pick one or the other** — installing both puts two copies on the
            machine. If that does happen, the dashboard now spots it and offers
            to remove the old one in a click.

            Windows may warn that the publisher is unknown, because the build
            is not code-signed. Choose **More info → Run anyway**.

            ### What changed
            See [WHAT-CHANGED.md](https://github.com/${{ github.repository }}/blob/main/all-versions/WHAT-CHANGED.md).
          # PUBLIC from 1.0.52 (2026-08-18), at the owner's request: he wants a
          # link he can send to friends. Every release before this was a draft
          # and visible only to him.
          #
          # What this means in practice: pushing a tag now publishes a
          # downloadable release to anyone, with no further click. The version
          # guard above is the only thing standing between a mistyped tag and a
          # public artifact, which is why it checks all three version files.
          # Set back to true if you ever want to review before shipping.
          releaseDraft: false
          prerelease: false
