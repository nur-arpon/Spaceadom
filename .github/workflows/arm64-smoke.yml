# ARM64 SMOKE TEST — the only ARM64 hardware this project has (2026-09-17).
#
# The owner has no Windows-on-ARM device. GitHub's `windows-11-arm` runner is
# a real ARM64 Windows 11 machine, so this workflow is where the ARM64 build
# is PROVEN TO RUN: it installs the arm64 setup.exe silently, launches the
# app, waits, and reads debug.log for the same lines scripts/install-proof.ps1
# reads on the owner's machine — the version banner, both hooks installed,
# the raw-input keyboard sink, the overlay configured, no panic, no
# REBUILD FAILED — then uploads the log.
#
# WHAT IT CANNOT PROVE: nobody holds Space or the middle button here, so the
# ring, Space+letter and law 6 stay UNPROVEN on ARM64. That is why the
# release notes call the ARM64 build a beta.
#
# Runs on demand, and automatically after a release is published (so every
# tag gets an ARM64 run of the exact installer that was shipped).
name: ARM64 smoke test

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag whose arm64 setup.exe to test (e.g. v1.0.114). Empty = build from this commit."
        required: false
        default: ""
  release:
    types: [published]

jobs:
  smoke:
    runs-on: windows-11-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Decide where the installer comes from
        id: src
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if ("${{ github.event_name }}" -eq "release") { $tag = "${{ github.event.release.tag_name }}" }
          if ($tag) {
            $ver = $tag -replace '^v',''
            $url = "https://github.com/${{ github.repository }}/releases/download/$tag/Spaceadom_${ver}_arm64-setup.exe"
            Invoke-WebRequest -Uri $url -OutFile Spaceadom_arm64-setup.exe
            "path=Spaceadom_arm64-setup.exe" >> $env:GITHUB_OUTPUT
            "from=release $tag" >> $env:GITHUB_OUTPUT
          } else {
            "path=" >> $env:GITHUB_OUTPUT
            "from=this commit" >> $env:GITHUB_OUTPUT
          }

      # Building from the commit: the same recipe as release.yml, on ARM64
      # natively (the runner's own toolchain is aarch64).
      - name: Set up Node
        if: steps.src.outputs.path == ''
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Rust
        if: steps.src.outputs.path == ''
        uses: dtolnay/rust-toolchain@stable
      - name: Write Sentry DSN from secret
        if: steps.src.outputs.path == ''
        shell: pwsh
        run: |
          $dsn = "${{ secrets.SENTRY_DSN }}"
          if (-not $dsn) { Write-Host "::error::SENTRY_DSN secret is missing"; exit 1 }
          [IO.File]::WriteAllText("src-tauri/src/sentry_dsn.txt", $dsn)
      - name: Build
        if: steps.src.outputs.path == ''
        shell: pwsh
        run: |
          npm ci
          npm run build
          npm run tauri build
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Copy-Item $exe.FullName Spaceadom_arm64-setup.exe

      - name: Install silently and launch
        shell: pwsh
        run: |
          $setup = Resolve-Path Spaceadom_arm64-setup.exe
          # PE machine type must be ARM64 (0xAA64) — the runner would happily
          # run an x64 installer under emulation, which would prove nothing.
          $b = [IO.File]::ReadAllBytes($setup); $pe = [BitConverter]::ToInt32($b, 0x3C); $m = [BitConverter]::ToUInt16($b, $pe + 4)
          Write-Host ("installer PE machine: 0x{0:X4}" -f $m)
          $p = Start-Process $setup -ArgumentList '/S' -PassThru -Wait
          Write-Host "installer exit $($p.ExitCode)"
          $exe = Join-Path $env:LOCALAPPDATA 'Spaceadom\spaceadom.exe'
          if (-not (Test-Path $exe)) { Write-Host "::error::no exe at $exe after install"; exit 1 }
          $b = [IO.File]::ReadAllBytes($exe); $pe = [BitConverter]::ToInt32($b, 0x3C); $m = [BitConverter]::ToUInt16($b, $pe + 4)
          Write-Host ("installed exe PE machine: 0x{0:X4} (0xAA64 = ARM64)" -f $m)
          if ($m -ne 0xAA64) { Write-Host "::error::the installed exe is not ARM64"; exit 1 }
          # The installer relaunches the app itself; make sure one is running.
          Start-Sleep 5
          if (-not (Get-Process spaceadom -ErrorAction SilentlyContinue)) { Start-Process $exe }
          Start-Sleep 40

      - name: Read the proof lines from debug.log
        shell: pwsh
        run: |
          $log = Join-Path $env:APPDATA 'Spaceadom\debug.log'
          if (-not (Test-Path $log)) { Write-Host "::error::no debug.log at $log — the app never started"; exit 1 }
          $t = Get-Content $log -Raw
          $checks = [ordered]@{
            'version banner'          = 'Spaceadom build — version'
            'keyboard + mouse hooks'  = 'hook: WH_KEYBOARD_LL + WH_MOUSE_LL installed'
            'raw-input keyboard sink' = 'hook: raw-input keyboard sink registered on the hook thread'
            'overlay configured'      = 'overlay: configured'
            # A fresh runner has no config.json, so the first-run line is the
            # one that appears (v1.0.114's run printed MISSING against
            # 'config: loaded' while everything else passed — 2026-09-18).
            'config loaded or seeded' = 'config: '
          }
          $fail = $false
          foreach ($k in $checks.Keys) {
            $ok = $t.Contains($checks[$k])
            Write-Host ("{0,-26} {1}" -f $k, $(if ($ok) { 'OK' } else { 'MISSING' }))
            if (-not $ok) { $fail = $true }
          }
          foreach ($bad in 'PANIC', 'REBUILD FAILED', 'OVERLAY_DISABLED') {
            if ($t.Contains($bad)) { Write-Host "::error::debug.log contains '$bad'"; $fail = $true }
          }
          $alive = [bool](Get-Process spaceadom -ErrorAction SilentlyContinue)
          Write-Host ("{0,-26} {1}" -f 'process alive after 40 s', $(if ($alive) { 'OK' } else { 'NO' }))
          if (-not $alive) { $fail = $true }
          Write-Host "--- banner ---"
          Select-String -Path $log -Pattern 'Spaceadom build — version' | Select-Object -Last 1 | ForEach-Object { $_.Line }
          if ($fail) { exit 1 }
          Write-Host "ARM64 smoke test PASSED (from ${{ steps.src.outputs.from }}): the ARM64 build installs, starts, hooks the keyboard and mouse, registers raw input and builds its overlay on real ARM64 Windows. Ring / Space+letter remain unproven (nobody pressed a key here)."

      - name: Upload debug.log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm64-debug-log
          path: ~/AppData/Roaming/Spaceadom/debug.log
          if-no-files-found: ignore
